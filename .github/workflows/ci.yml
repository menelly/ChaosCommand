name: CI

# Runs the framework-free golden suites + typecheck on every push/PR, plus the
# Rust unit tests for the license + trial logic. This is the "testing" a repo
# audit looks for — and real regression protection for the safety-critical lab
# parsing, confabulation guard, entitlement resolver, and license loop.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    name: Typecheck + golden suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Golden test suites
        run: pnpm test

  rust:
    name: Rust unit tests (license + trial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
