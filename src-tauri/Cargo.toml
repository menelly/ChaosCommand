[package]
name = "app"
version = "1.0.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Legacy Polar sandbox flag — retained in case we ever switch BACK to a
# hosted license server. Current v1 uses offline Ed25519 signed keys
# (no network required). See src/license.rs.
sandbox = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
tauri-plugin-opener = "2.5"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
# File-save via the OS picker (Storage Access Framework on Android). The ONLY
# scoped-storage-correct way to export a file the user can keep: save() returns a
# content:// URI we writeFile() to. Replaces the broken blob-download / writeFile-
# to-Download / openPath path that silently no-op'd (backup) or crashed with
# FileUriExposedException (PDF) on Android 11+. See lib/export-file.ts.
tauri-plugin-dialog = "2"

tokio = { version = "1.0", features = ["full"] }
# "stream" feeds the chunked model download in llm.rs (bytes_stream + resume).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hostname = "0.4"

# Offline license-key validation via Ed25519 signatures (no network needed)
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
base64 = "0.22"

# Auto-sync persistent server: HMAC-SHA256 auth on /sync, secure RNG for
# peer_ids and shared secrets. All four are already transitive deps via
# tauri/ed25519-dalek/etc — declared explicitly so the new modules can use them.
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.2"

# Desktop-only: launch-on-login for background reminders. Excluded from the
# Android/iOS builds (no such concept on mobile); the lib.rs registration is
# #[cfg(desktop)]-gated to match.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

# Native MedGemma inference for document import (llm.rs). Desktop-only: the
# upload path doesn't exist on mobile, and llama.cpp adds minutes to the
# Android build for nothing. Builds llama.cpp from source via cmake.
llama-cpp-2 = "0.1.150"
encoding_rs = "0.8"
# Physical- vs logical-core count for llama.cpp thread tuning (see llm.rs).
num_cpus = "1.16"
